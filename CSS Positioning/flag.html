<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zastava</title>
    <style>
        .red {
            width: 500px;
            height: 300px;
            background-color: red;
            position: relative;  
        }

        .blue {
            width: 500px;
            height: 150px;
            background-color: blue;
            position: absolute;
            top: 75px; 
        }

        .krug {
            width: 130px;
            height: 130px;
            background-color: white;
            position: absolute;
            top: 85px;
            left: 190px;
            border-radius: 50%;
        }
          .zastava {
                width: 500px ;
                height:300px ;
                background-color: blue;
                position: relative;
            }

            .Žuta1{
                width: 500px;
                height:60px;
                background-color: yellow;
                position: absolute;
                top: 120px;

            }
            
            .Žuta2 {
                height: 300px;
                width: 60px;
                background-color: yellow;
                position: absolute;
                left: 180px;

            }

    </style>
</head>
<body>
    <h1>Zastava Laosa</h1>
    <div class="red">
        <div class="blue"></div>
        <div class="krug"></div>
    </div>
    <h1>Zastava Švedske</h1>
    <div class="zastava">
       
        <div class="Žuta1"></div>
        <div class="Žuta2"></div>

       
    </div>
    
</body>
</html>
