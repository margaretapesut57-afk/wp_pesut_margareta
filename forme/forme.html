<body>
    <h2>Forme u HTML-u</h2>
    <p id="prvi">Ovo je prvi paragraf</p>
    <p class="drugi">Ovo je drugi paragraf</p>
    <form action="#" method="get">
        <label for="ime">Unesi ime</label>
        <input type="text" id="ime" placeholder="Unesi ime...">
        <br>
        <label for="prezime">Unesi prezime:</label>
        <input type="text" id="prezime">
        <br>
        <label for="pass">Unesi lozinku:</label>
        <input type="password" name="pass" id="pass" required>
        <br>
        <label for="email">Unesi email:</label>
        <input type="email" name="email" id="email"> 
        <br>
        <label for="date">Izaberi datum:</label>
        <input type="date" name="date" id="date">
        <br>
        <label for="color">Izaber boju:</label>
        <input type="color" name="color" id="color">
        <br>
        <p>Izaberi nabolji predmet:</p>
        <input type="radio" name="predmett" id="Hrvatski">
        <label for="Hrvatski">Hrvatski</label> <br>
        <input type="radio" name="predmett" id="Matematika">
        <label for="Matematika">Matematika</label> <br>
        <input type="radio" name="predmett" id="Tjelesni">
        <label for="Tjelesni">Tjelesni</label> <br>

        <p>U slobodno vrijeme najčešće:</p>
        <input type="checkbox" name="knjiga" id="knjiga">
        <label for="knjiga">Čitam knjigu</label> <br>
        <input type="checkbox" name="izlazak" id="izlazak">
        <label for="izlazak">Izlazim van</label> <br>
        <input type="checkbox" name="učenje" id="učenje">
        <label for="učenje">Učim</label> <br>
        <input type="checkbox" name="glazba" id="glazba">
        <label for="glazba">Slušam glazbu</label> <br>
        <br>
        <input type="submit" value="Pošalji">
        <input type="reset" value="Poništi">
        <br>
        <br><br>


    </form>
    <form action="#" method="get">
    <label for="First name:">Unesi ime:</label>
    <input type="text" id="ime">
    <br>
    <label for="Last name:">Unesi prezime:</label>
    <input type="text" id="prezime">
    <br>
    <input type="radio" name="žensko" id="žensko">
    <label for="žensko">žensko</label>
    <input type="radio" name="muško" id="muško">
    <label for="muško">muško</label>
    <br>
    <label for="ID zaposlenika">ID zaposlenika:</label>
    <input type="text" id="ID zaposlenika">
    <br>
    <label for="Oznaka">Oznaka:</label>
    <input type="text" id="Oznaka">
    <br>
    <label for="Broj telefona">Broj telefona:</label>
    <input type="text" id="Broj telefona">
    <br>
<input type="submit" value="Pošalji">
    </form>

    
</body>
</html>
